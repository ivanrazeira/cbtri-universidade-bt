<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Validar certificado · Brasil Triathlon Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#0b2b27;--teal:#0e6b60;--teal-d:#083f39;--gray-50:#f6f8f8;--gray-200:#e3e8e8;--ok:#166534;--okbg:#e8f5ee;--err:#c53030;--errbg:#fdecec}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--navy);
    background:radial-gradient(120% 60% at 50% 0%,#14887a 0%,#0e6b60 40%,#083f39 100%) fixed;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 50px}
  .brand{text-align:center;color:#fff;margin-bottom:16px}
  .brand img{height:84px}
  .brand .t{font-weight:700;letter-spacing:.5px;font-size:13px;opacity:.9;margin-top:4px}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin-bottom:14px}
  h1{font-size:18px;margin-bottom:10px}
  label{display:block;font-size:12px;font-weight:700;color:#445;margin:6px 0 4px}
  input{width:100%;padding:11px 13px;border:1px solid var(--gray-200);border-radius:10px;font-size:15px;text-transform:uppercase}
  .btn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;background:var(--teal);color:#fff}
  .banner{border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
  .banner.ok{background:var(--okbg);color:var(--ok)}
  .banner.err{background:var(--errbg);color:var(--err)}
  .grid{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;margin-top:14px}
  .grid .k{color:#667}
  .grid .v{text-align:right;font-weight:600}
  .muted{color:#667;font-size:13px}
  .lnk{display:inline-block;margin-top:14px;color:var(--teal);font-weight:700;text-decoration:none}
  .hidden{display:none}
  .foot{text-align:center;color:rgba(255,255,255,.75);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<script>
  window.UBT_CONFIG = {
    SUPABASE_URL: "https://edbyrcyvlowcylljebmq.supabase.co",
    SUPABASE_ANON_KEY: "sb_publishable_g-Hpp9Y3nIDRgva2nkSlcw_FiQTHkfs"
  };
</script>
<div class="wrap">
  <div class="brand">
    <img src="https://edbyrcyvlowcylljebmq.supabase.co/storage/v1/object/public/ubt/marca/logo-academy.png" alt="Brasil Triathlon Academy" onerror="this.style.display='none'">
    <div class="t">BRASIL TRIATHLON ACADEMY · CBTri</div>
  </div>

  <div class="card">
    <h1>Validação de certificado</h1>
    <div class="muted">Confirme a autenticidade de um certificado emitido pela Brasil Triathlon Academy pelo código impresso no documento (ou escaneando o QR).</div>
    <label for="cod">Código do certificado</label>
    <input id="cod" placeholder="BTA-2026-000001" autocomplete="off">
    <button class="btn" onclick="validar()">Verificar</button>
  </div>

  <div id="resultado"></div>
  <div class="foot">© 2026 Brasil Triathlon Academy · CBTri</div>
</div>

<script>
const cfg = window.UBT_CONFIG;
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => { try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return ''; } };
const params = new URLSearchParams(location.search);

async function validar(){
  const cod = (document.getElementById('cod').value||'').trim();
  const box = document.getElementById('resultado');
  if(!cod){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="card muted">Verificando…</div>';
  const { data, error } = await sb.rpc('ubt_cert_validar', { p_cod: cod });
  if(error){ box.innerHTML = `<div class="card"><div class="banner err">⚠️ Erro ao verificar</div><div class="muted" style="margin-top:8px">${esc(error.message)}</div></div>`; return; }
  if(!data){
    box.innerHTML = `<div class="card"><div class="banner err">✖ Certificado não encontrado</div>
      <div class="muted" style="margin-top:10px">Nenhum certificado com o código <b>${esc(cod)}</b>. Confira a digitação.</div></div>`;
    return;
  }
  const c = data.campos || {};
  const revogado = data.situacao === 'revogado';
  const docUrl = location.origin + '/certificado?cod=' + encodeURIComponent(data.codigo);
  box.innerHTML = `
    <div class="card">
      <div class="banner ${revogado?'err':'ok'}">${revogado?'⛔ Certificado REVOGADO':'✓ Certificado válido'}</div>
      ${revogado&&data.motivo_revogacao?`<div class="muted" style="margin-top:8px">Motivo: ${esc(data.motivo_revogacao)}</div>`:''}
      <div class="grid">
        <span class="k">Titular</span><span class="v">${esc(data.nome)}</span>
        <span class="k">${data.tipo==='nivel'?'Certificação':'Curso'}</span><span class="v">${esc(c.titulo||'')}</span>
        ${c.carga?`<span class="k">Carga horária</span><span class="v">${esc(c.carga)}</span>`:''}
        ${c.periodo?`<span class="k">Período</span><span class="v">${esc(c.periodo)}</span>`:''}
        <span class="k">Código</span><span class="v">${esc(data.codigo)}</span>
        <span class="k">Emitido em</span><span class="v">${fmt(data.emitido_em)}</span>
      </div>
      ${revogado?'':`<a class="lnk" href="${docUrl}" target="_blank" rel="noopener">📄 Ver o certificado completo →</a>`}
    </div>`;
}

// Autovalidar quando vem do QR (?cod=...)
const cod0 = (params.get('cod')||params.get('codigo')||'').trim();
if(cod0){ document.getElementById('cod').value = cod0; validar(); }
document.getElementById('cod').addEventListener('keydown', e=>{ if(e.key==='Enter') validar(); });
</script>
</body>
</html>
